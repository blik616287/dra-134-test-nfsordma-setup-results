# ============================================================================
# Ubuntu MAAS Layer with NFSoRDMA and SR-IOV Support
# ============================================================================
#
# REQUIRED CLUSTER VARIABLES:
# ---------------------------
# Add these variables to your Spectro Cloud cluster profile:
#
# ## SR-IOV Configuration (for BlueField-3 DPUs in SuperNIC mode)
# EnableSRIOV: "true"
# numberOfVFs: "0"              # Not used - BlueField-3 detected as DPU type
# numberofDPUVFs: "4"           # VFs for DPU-type NICs (BlueField-3)
# ControlDPUs: "true"           # Allow nodeprep to configure DPUs
# DPUOffloadEngine: "false"     # Keep SuperNIC mode (INTERNAL_CPU_OFFLOAD_ENGINE=DISABLED)
# disableACS: "true"            # Disable ACS for proper PCIe peer-to-peer
#
# ## NFSoRDMA Configuration
# NFSoRDMAEnabled: "true"
# NFSServerOnCP: "true"         # Install NFS server on control-plane
# NFSExportPath: "/srv/nfs/shared"
# NFSRDMANetwork: "10.0.100.0/24"
# NFSServerRDMAIP: "10.0.100.1"
# NFSClientRDMAIPBase: "10.0.100"  # Workers get .2, .3, etc.
# RDMAInterface: "enp14s0f0np0"    # First BlueField-3 port
#
# ## Existing Required Variables (from base profile)
# MaaSURI: "http://<maas-server>:5248/MAAS"
# K8sNodeCIDR: "172.16.32.0/24"
# NodeprepCP: "true"
# UpdatePackages: "false"
# BfbBundle: "bf-fwbundle-3.2.1-34_25.11-prod.bfb"
# BFBFW: "32.47.1088"
# DocaDebFile: "doca-host_3.2.1-044000-25.10-ubuntu2204_amd64.deb"
# LinkType_EW: "Ethernet"
# LinkType_NS: "Ethernet"
# InstallNVNCC: "false"
# NVNCCDebFile: ""
#
# ============================================================================
# Hardware Detection Notes:
# - BlueField-3 B3220 P-Series DPUs are detected as "DPU" type by nodeprep
# - Even in SuperNIC mode, the script uses numberofDPUVFs (not numberOfVFs)
# - INTERNAL_CPU_OFFLOAD_ENGINE=DISABLED(1) = SuperNIC mode
# - INTERNAL_CPU_OFFLOAD_ENGINE=ENABLED(0) = Full DPU mode
# ============================================================================
#
# NFSoRDMA POD USAGE:
# ------------------
# Use PV/PVC with RDMA mount options. Kubelet passes mountOptions to mount cmd.
#
# PersistentVolume:
#   apiVersion: v1
#   kind: PersistentVolume
#   metadata:
#     name: nfs-rdma-pv
#   spec:
#     capacity:
#       storage: 100Gi
#     accessModes:
#       - ReadWriteMany
#     persistentVolumeReclaimPolicy: Retain
#     mountOptions:
#       - proto=rdma
#       - port=20049
#       - vers=4.1
#       - rsize=1048576
#       - wsize=1048576
#     nfs:
#       server: 10.0.100.1    # Use RDMA network IP
#       path: /srv/nfs/shared
#
# PersistentVolumeClaim:
#   apiVersion: v1
#   kind: PersistentVolumeClaim
#   metadata:
#     name: nfs-rdma-pvc
#   spec:
#     accessModes:
#       - ReadWriteMany
#     resources:
#       requests:
#         storage: 100Gi
#     volumeName: nfs-rdma-pv
#     storageClassName: ""
#
# Pod:
#   apiVersion: v1
#   kind: Pod
#   metadata:
#     name: my-workload
#   spec:
#     containers:
#     - name: app
#       image: your-image
#       volumeMounts:
#       - name: nfs-data
#         mountPath: /data
#     volumes:
#     - name: nfs-data
#       persistentVolumeClaim:
#         claimName: nfs-rdma-pvc
#     nodeSelector:
#       spectrocloud.com/nfsordma: enabled
#
# IMPORTANT: Use the RDMA network IP (10.0.100.1) not the node IP (172.16.32.42)
# Worker nodes must have xprtrdma module loaded and RDMA network connectivity.
#
# ============================================================================

kubeadmconfig:
  preKubeadmCommands:
    - 'echo "====> Applying pre Kubeadm commands"'
    # Force specific IP address as the Node InternalIP for kubelet
    - |
      apt update && apt install -y grepcidr
      NETWORKS="{{ .spectro.var.K8sNodeCIDR }}"
      IPS=$(hostname -I)
      for IP in $IPS
      do
        echo "$IP" | grepcidr "$NETWORKS" >/dev/null && echo " --node-ip=$IP" >> /etc/default/kubelet
        if [ $? -eq 0 ]; then break; fi
      done
    # Install nfs-common for Longhorn and NFS clients
    - apt install -y nfs-common
    # Install NFSoRDMA kernel modules (compatible with MLNX OFED)
    - |
      if "{{.spectro.var.NFSoRDMAEnabled}}"; then
        echo "====> Installing NFSoRDMA support"
        # Will be fully configured after DOCA is installed in nodeprep
        # Pre-create module load config
        echo "rpcrdma" > /etc/modules-load.d/nfsrdma.conf
        echo "xprtrdma" >> /etc/modules-load.d/nfsrdma.conf
        echo "svcrdma" >> /etc/modules-load.d/nfsrdma.conf
      fi
    # Update CA certs
    - update-ca-certificates
    # Update initramfs
    - update-initramfs -u
    # Reload and restart containerd
    - systemctl daemon-reload
    - systemctl restart containerd
    # Hold kernel packages to prevent kernel changes during apt updates
    - |
      apt-mark hold $(apt-mark showauto linux-\*image-\*)
      apt-mark hold $(apt-mark showauto linux-\*headers-\*)
      apt-mark hold $(apt-mark showauto linux-\*modules-\*)
      apt-mark hold $(apt-mark showauto linux-\*cloud-tools-\*)
      apt-mark hold $(apt-mark showauto linux-\*tools-\*)
      apt-mark hold $(apt-mark showmanual linux-\*image-\*)
      apt-mark hold $(apt-mark showmanual linux-\*headers-\*)
      apt-mark hold $(apt-mark showmanual linux-\*modules-\*)
      apt-mark hold $(apt-mark showmanual linux-\*cloud-tools-\*)
      apt-mark hold $(apt-mark showmanual linux-\*tools-\*)
  postKubeadmCommands:
    - 'echo "====> Applying post Kubeadm commands"'
    # Delete the kube-proxy daemonset and configmap for Cilium eBPF native mode
    - |
      if test -f /etc/kubernetes/admin.conf; then
        echo "======> Cilium prep for kube-proxy-less (control-plane)"
        export KUBECONFIG=/etc/kubernetes/admin.conf
        until $(kubectl -n kube-system delete --ignore-not-found=true ds kube-proxy > /dev/null); do
          echo "Failed to delete kube-proxy daemonset, will retry in 5s"
          sleep 5
        done
        until $(kubectl -n kube-system delete --ignore-not-found=true cm kube-proxy > /dev/null); do
          echo "Failed to delete kube-proxy configmap, will retry in 5s"
          sleep 5
        done
        iptables-save | grep -v KUBE | iptables-restore
      fi
    # Setup NFS Server with RDMA on control-plane node
    - |
      if test -f /etc/kubernetes/admin.conf && "{{.spectro.var.NFSServerOnCP}}"; then
        echo "======> Setting up NFS Server with RDMA support on control-plane"

        # Install NFS server
        NEEDRESTART_MODE=l apt-get install -y nfs-kernel-server

        # Create export directory
        mkdir -p {{.spectro.var.NFSExportPath}}
        chmod 777 {{.spectro.var.NFSExportPath}}
        chown nobody:nogroup {{.spectro.var.NFSExportPath}}

        # Configure exports - allow pod network, node network, and RDMA network
        cat > /etc/exports <<EXPORTS
{{.spectro.var.NFSExportPath}}  10.0.0.0/8(rw,sync,no_subtree_check,no_root_squash) 172.16.0.0/12(rw,sync,no_subtree_check,no_root_squash) {{.spectro.var.NFSRDMANetwork}}(rw,sync,no_subtree_check,no_root_squash)
EXPORTS

        # Create systemd service for persistent RDMA port (will be started after DOCA/nodeprep)
        cat > /etc/systemd/system/nfs-rdma.service <<NFSRDMA
[Unit]
Description=Enable NFS over RDMA
After=nfs-server.service
Requires=nfs-server.service

[Service]
Type=oneshot
ExecStartPre=/sbin/modprobe rpcrdma
ExecStart=/bin/bash -c 'echo "rdma 20049" > /proc/fs/nfsd/portlist'
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
NFSRDMA

        systemctl daemon-reload
        systemctl enable nfs-rdma.service

        echo "======> NFS Server configured, RDMA will be enabled after nodeprep completes"
      fi
    # Run nodeprep, tag CP nodes for Longhorn storage
    - |
      if test -f /etc/kubernetes/admin.conf; then
        kubectl annotate node $(hostname) node.longhorn.io/default-node-tags='["storage"]' --kubeconfig /etc/kubernetes/admin.conf
        if "{{.spectro.var.NodeprepCP}}"; then
          /opt/spectrocloud/nodeprep.sh
        else
          kubectl taint nodes $(hostname) spectrocloud.com/nodeprep- --kubeconfig /etc/kubernetes/admin.conf
        fi
      else
        /opt/spectrocloud/nodeprep.sh
      fi
  files:
    - targetPath: /etc/modprobe.d/blacklist-nouveau.conf
      targetOwner: "root:root"
      targetPermissions: "0755"
      content: |-
        blacklist nouveau
        blacklist lbm-nouveau
        options nouveau modeset=0
        alias nouveau off
        alias lbm-nouveau off
    - targetPath: /etc/systemd/system/containerd.service.d/override.conf
      targetOwner: "root:root"
      targetPermissions: "0755"
      content: |-
        [Service]
        # allow children (shims/containers) to inherit unlimited memlock
        LimitMEMLOCK=infinity
        # (optional but common in HPC)
        LimitNOFILE=1048576
        LimitNPROC=infinity
    - targetPath: /etc/kubernetes/kubelet.conf.d/10-kubelet-tuning.conf
      targetOwner: "root:root"
      targetPermissions: "0644"
      content: |-
        apiVersion: kubelet.config.k8s.io/v1beta1
        kind: KubeletConfiguration
        cpuManagerPolicy: static
        reservedSystemCPUs: "0"
        maxPods: 250
        registerWithTaints:
          - key: spectrocloud.com/nodeprep
            effect: NoSchedule
    - targetPath: /usr/local/share/ca-certificates/org_ca.crt
      targetOwner: "root:root"
      targetPermissions: "0644"
      content: |
        -----BEGIN CERTIFICATE-----
        MIIDHzCCAgegAwIBAgIUC2VKm0kzJFb8sDxcYIAHpRsrkZwwDQYJKoZIhvcNAQEL
        BQAwEjEQMA4GA1UEAwwHcm9vdF9jYTAeFw0yMzA1MTUwMjI3MDdaFw0yOTAxMjYx
        MDI3MzdaMA0xCzAJBgNVBAMTAmNhMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIB
        CgKCAQEA1xaF23C53r7hOjAY6lTeNX5aBCaF9scdl/Dt4G16eKLRbGhOxdglk6N1
        A6nrErJMxk8QIFY33ZBKCDGIvefsDEoHX7J9MTjlSpvXJgyjLsmRUhWvTOnNf+oe
        xdIC2dRWuU+8y/6JbnaWfx4hYyLbYEguJyrFrFUjwQ1bdJIChnvzRFUV43uKLENC
        vR/CiWy/v9m7itCl4WmVRw6+4GLv/IYzSc+EWpC4Rr/z8beQT0l+fmAgdakyfuKP
